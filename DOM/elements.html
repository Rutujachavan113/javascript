<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM</title>
</head>
<body>
  <div class="parent">
    <div class="day">monday</div>
    <div class="day">tuesday</div>
    <div class="day">wednday</div>
    <div class="day">thurday</div>
  </div>
</body>
<script>
    const parent=document.querySelector(".parent");
    console.log(parent);
    console.log(parent.children);
    console.log(parent.children[1].innerHTML);

    // bcoz for loop works only on html collection and parent.children gives html collection
    for (let i = 0; i < parent.children.length; i++) {
        console.log(parent.children[i].innerHTML);
        
    }
//from going to parent to child
    parent.children[1].style.color="orange";
    console.log(parent.firstElementChild);//    <div class="day">monday</div>

    console.log(parent.lastElementChild);//    <div class="day">thurday</div>

// from going to child to parent
const dayOne=document.querySelector('.day');
console.log(dayOne);//<div class="day">monday
    console.log(dayOne.parentElement);
     console.log(dayOne.nextElementSibling);

     console.log("NODES=",parent.childNodes);
     
    
    

    

    
    
    
</script>
</html>
